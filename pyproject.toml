[project]
name = "yf-parqed"
version = "0.5.0rc5"
description = "Persistent storage of yfinance ticker data in parquet"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sigurður Smárason", email = "smarason.sigurdur@gmail.com" },
]
keywords = ["yfinance", "parquet", "finance", "stocks", "xetra", "time-series"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Database",
]
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.0",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    "rich>=13.0.0",
    "typer>=0.15.1",
    "yfinance>=0.2.66",
]

[project.urls]
Repository = "https://github.com/SiggiSmara/yf_parqed"
Issues = "https://github.com/SiggiSmara/yf_parqed/issues"

[project.scripts]
yf-parqed = "yf_parqed.yfinance_cli:app"
xetra-parqed = "yf_parqed.xetra_cli:app"
yf-parqed-migrate = "yf_parqed.tools.partition_migrate:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pre-commit>=4.0.1",
    "pytest-cov>=6.2.1",
    "pytest>=8.4.1",
    "ruff>=0.14.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "live: marks tests that make real API calls (run with '-m live')",
]
